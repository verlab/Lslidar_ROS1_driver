version: '3.8'

services:
  lslidar_driver:
    build: .
    container_name: lslidar_driver
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /lidar_ws
    command: >
      bash -c "
        source devel/setup.bash &&
        roslaunch lslidar_driver lslidar_cx.launch
      "
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
